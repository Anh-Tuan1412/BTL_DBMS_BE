services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_local_test
      MYSQL_DATABASE: movie_ticket_db
      MYSQL_USER: movie_user
      MYSQL_PASSWORD: movie_password
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - mysql_test:/var/lib/mysql
      - ./BTL_DBMS_BE/backend/database/movie_ticket_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6387:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    depends_on:
      - mysql

volumes:
  mysql_test:
